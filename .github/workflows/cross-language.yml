name: Cross-language

# The live Python<->TypeScript checks (WSM-TST-004/005, WSM-CDC-007), and the documentation examples
# that need both languages. `ci.yml` runs each language against itself; this file is the only place
# the two ports speak to one another over a real socket, in both role assignments, for every codec
# that ships.
#
# One job, because every step needs the same two toolchains and the same two installs, and the
# steps themselves take seconds. Each check is its own step and runs even when an earlier one failed,
# so one run reports every failing pair.
on:
  push:
    branches: [main]
  pull_request:

env:
  # muxws counts every size limit in UTF-8 bytes (WSM-FRG-002) and the interop scenario and the
  # examples carry non-ASCII payloads, so the runner's locale is load-bearing rather than incidental.
  LANG: C.UTF-8

jobs:
  cross-language:
    name: cross-language
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # `[dev]` already carries `msgpack`, so the Python side needs nothing conditional.
      - run: pip install -e .[dev]
      # `npm install`, not `npm ci`: package-lock.json is deliberately not committed, so that CI
      # resolves dependencies afresh and tests against current upstream rather than a frozen tree.
      # `@msgpack/msgpack` is an *optional* peer dependency (WSM-PKG-003) and a devDependency, so
      # this install pulls it in; the second command keeps it present if the devDependency goes.
      # Evidence that the json legs never reach msgpack is `ts/packaging.spec.ts`, which bundles
      # `ts/index.ts` and greps the output.
      - id: install
        run: |
          npm install
          npm install --no-save @msgpack/msgpack

      # WSM-TST-004 and WSM-CDC-007: {Python acceptor, TS dialer} and {TS acceptor, Python dialer},
      # each under json and msgpack. A scenario run in one role assignment proves only that one
      # side's parity, ids and close semantics agree with themselves, and a codec that ships without
      # a live cross-language pair MUST NOT ship.
      #
      # Each leg runs three scenarios through `interop/drive.sh`:
      #   main    the hand-written scenario over TCP.
      #   unix    the same scenario over a socket file. The protocol is identical; what is at risk is
      #           the `ws+unix:` URL grammar, which each port parses with its own code. The acceptors
      #           report the request target they were handed and the driver compares it with the
      #           route it put in the URL, query string included.
      #   corpus  the sequence corpus, replayed by a Python peer and a TypeScript peer to each other.
      #           The in-process runners have a peer of one language at each end and prove only that
      #           their own port agrees with itself.
      #
      # The codec is exported in both spellings (WSM-CDC-010): the Python half reads MUXWS_CODEC and
      # the TypeScript half reads VITE_MUXWS_CODEC, which Vite substitutes at build time and which
      # does not exist under node, so `interop/runner.ts` reads it from the environment itself. It is
      # also passed to the driver as an argument, the one copy that does not come from the variables
      # under test, so a step whose environment never reached a process fails instead of running json
      # under a msgpack name.
      #
      # The last argument of `corpus` is how many fixtures the leg must exercise: the whole corpus
      # under msgpack and one fewer under json, which cannot carry `bytes-payload-under-binary-codec`
      # (WSM-CDC-008). It is pinned here rather than counted by the conductor, because a conductor
      # that counted its own fixtures could report three of them as thirteen. Adding a sequence
      # fixture means raising these two numbers alongside EXPECTED_SEQUENCE_FIXTURES in both
      # conformance runners.
      - name: python acceptor, ts dialer, json
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          MUXWS_CODEC: json
          VITE_MUXWS_CODEC: json
        run: |
          export MUXWS_VENV=$(dirname $(which python))
          interop/drive.sh python ts main json
          interop/drive.sh python ts unix json
          interop/drive.sh python ts corpus json 13
      - name: ts acceptor, python dialer, json
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          MUXWS_CODEC: json
          VITE_MUXWS_CODEC: json
        run: |
          export MUXWS_VENV=$(dirname $(which python))
          interop/drive.sh ts python main json
          interop/drive.sh ts python unix json
          interop/drive.sh ts python corpus json 13
      - name: python acceptor, ts dialer, msgpack
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          MUXWS_CODEC: msgpack
          VITE_MUXWS_CODEC: msgpack
        run: |
          export MUXWS_VENV=$(dirname $(which python))
          interop/drive.sh python ts main msgpack
          interop/drive.sh python ts unix msgpack
          interop/drive.sh python ts corpus msgpack 14
      - name: ts acceptor, python dialer, msgpack
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          MUXWS_CODEC: msgpack
          VITE_MUXWS_CODEC: msgpack
        run: |
          export MUXWS_VENV=$(dirname $(which python))
          interop/drive.sh ts python main msgpack
          interop/drive.sh ts python unix msgpack
          interop/drive.sh ts python corpus msgpack 14

      # WSM-TST-005: the acceptor is SIGKILLed with streams open and a second one is started on the
      # same port, in both role assignments, because "the replayed hello the OTHER language's
      # acceptor accepts" has two directions. Not run over a socket file: a SIGKILLed acceptor cannot
      # unlink its own socket file (see `interop/drive.sh`).
      - name: reconnect, python acceptor, ts dialer
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          MUXWS_CODEC: json
          VITE_MUXWS_CODEC: json
        run: MUXWS_VENV=$(dirname $(which python)) interop/drive.sh python ts reconnect json
      - name: reconnect, ts acceptor, python dialer
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          MUXWS_CODEC: json
          VITE_MUXWS_CODEC: json
        run: MUXWS_VENV=$(dirname $(which python)) interop/drive.sh ts python reconnect json

      # Every TypeScript `### Example` block on an API page, plus the quick-start clients dialling the
      # Python acceptor and their stdout compared with the block printed in the guide.
      # `examples.spec.ts` starts the acceptor with MUXWS_PYTHON; without it the probe falls back to
      # `python3`, and a failed probe turns the two client tests into skips rather than failures.
      - name: typescript examples
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: MUXWS_PYTHON="$(which python)" npx vitest run docs/examples/examples.spec.ts
