name: CI

# A pull request runs every job once; a push runs them only on main, where the merge result is
# checked again. A push to a branch with an open pull request would otherwise run each job twice on
# the same commit.
on:
  push:
    branches: [main]
  pull_request:

env:
  # muxws counts every size limit in UTF-8 bytes (WSM-FRG-002) and its corpus contains non-BMP
  # characters; the tests require a UTF-8 locale.
  LANG: C.UTF-8

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest --cov=muxws --cov-report=json
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: python-coverage
          path: coverage.json
        # The incremental coverage check reads one coverage report, so only one matrix leg uploads it.
        if: matrix.python-version == '3.13'

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # The packed declarations, type-checked by a consumer under bundler, node16, nodenext and node10.
      - run: npm run types:check
      # The documentation site: `check-docs.mjs` checks that every exported symbol has an entry with
      # all five sections, that every duration has a unit, that no link or anchor is dead and that a
      # page links SPEC.md. The build then fails on a dead internal link. The examples on the API
      # pages run in `cross-language.yml` (TypeScript, against the Python acceptor) and in the python
      # job above (`docs/examples` is in `testpaths`).
      - run: npm run docs:check
      - run: npm run docs:build
      - uses: actions/upload-artifact@v7
        with:
          name: node-coverage
          path: coverage/coverage-final.json
        if: github.event_name == 'pull_request'

  # The browser demo in Chromium, once per backend: `demo/e2e/demo.e2e.ts` starts `demo.py --browser`
  # and uses every control on the page.
  demo-e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [python, node]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          MUXWS_DEMO_BACKEND: ${{ matrix.backend }}
      - uses: actions/upload-artifact@v7
        with:
          name: demo-e2e-${{ matrix.backend }}
          path: demo/e2e/test-results
        if: failure()

  coverage:
    name: Incremental coverage check
    runs-on: ubuntu-latest
    needs: [python, node]
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: '*-coverage'
          merge-multiple: true

      - name: Incremental coverage check
        uses: velis74/incremental-coverage-check@v3
        with:
          coverage-files: |
            coverage.json
            coverage-final.json
          # demo/, docs/ and interop/ are runnable examples and cross-language harnesses, not library
          # code. Neither pytest (scoped to muxws/) nor vitest (scoped to ts/) measures them, so they
          # have no coverage data and are excluded.
          extra-ignore-patterns: |
            demo/**
            demo.py
            docs/**
            interop/**
            scripts/**
            ts/index.ts
          log-level: INFO
          base-ref: ${{ github.base_ref }}
          head-ref: HEAD
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ github.event.pull_request.number }}

  # Interop runs in `cross-language.yml`, in both role assignments over both codecs, on the same
  # triggers as this workflow.

  # the required status check: fails when any other job of this workflow failed or was cancelled
  all-green:
    if: always()
    needs: [python, node, demo-e2e, coverage]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
