name: CI

on:
  push:
  pull_request:

env:
  # muxws counts every size limit in UTF-8 bytes (WSM-FRG-002) and its corpus carries non-BMP
  # characters, so the runner's locale is load-bearing rather than incidental.
  LANG: C.UTF-8

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .[dev] ruff
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=muxws --cov-report=json
      - uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: coverage.json
        # The incremental coverage check grades one revision, so uploading from every matrix leg
        # would just overwrite the same artifact with an identical file.
        if: matrix.python-version == '3.13'

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # `npm install`, not `npm ci`: package-lock.json is deliberately not committed, so that CI
      # resolves dependencies afresh and tests against current upstream rather than a frozen tree.
      # See GAPS.md.
      - run: npm install
      # `lint:ci`, not `lint`: the developer script carries `--fix`, which rewrites the violation and
      # exits 0. In CI that rewrite is discarded with the runner, so an auto-fixable violation would
      # be reported by nothing and reach main unnoticed.
      - run: npm run lint:ci
      - run: npm test
      - run: npm run build
      - run: npm run docs:build
      - uses: actions/upload-artifact@v4
        with:
          name: node-coverage
          path: coverage/coverage-final.json
        if: github.event_name == 'pull_request'

  coverage:
    name: Incremental coverage check
    runs-on: ubuntu-latest
    needs: [python, node]
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-coverage'
          merge-multiple: true

      - name: Incremental coverage check
        uses: velis74/incremental-coverage-check@v3
        with:
          coverage-files: |
            coverage.json
            coverage-final.json
          # demo/, docs/ and interop/ are runnable examples and cross-language harnesses, not
          # library code - neither pytest (scoped to muxws/) nor vitest (scoped to ts/) measures
          # them, so grading them here would fail every PR that touches one on "no coverage data".
          extra-ignore-patterns: |
            demo/**
            demo.py
            docs/**
            interop/**
          log-level: INFO
          base-ref: ${{ github.base_ref }}
          head-ref: HEAD
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ github.event.pull_request.number }}

  # Interop belongs in `cross-language.yml`, which runs both role assignments over both codecs on
  # the same triggers. A second copy here would be a strict subset of that matrix: two jobs to keep
  # in step, and the one that ships fewer codecs is the one that rots.
