name: CI

# A pull request runs every job once; a push runs them only on main, where the merge result is
# checked again. A push to a branch with an open pull request would otherwise run each job twice on
# the same commit.
on:
  push:
    branches: [main]
  pull_request:

env:
  # muxws counts every size limit in UTF-8 bytes (WSM-FRG-002) and its corpus contains non-BMP
  # characters; the tests require a UTF-8 locale.
  LANG: C.UTF-8

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .[dev] ruff
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=muxws --cov-report=json
      - uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: coverage.json
        # The incremental coverage check reads one coverage report, so only one matrix leg uploads it.
        if: matrix.python-version == '3.13'

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # `npm install`, not `npm ci`: package-lock.json is not committed, so CI resolves dependencies
      # on every run and tests against current upstream versions.
      - run: npm install
      # `lint:ci`, not `lint`: `lint` runs with `--fix`, which rewrites auto-fixable violations and
      # exits 0, so in CI those violations would pass unreported.
      - run: npm run lint:ci
      - run: npm test
      - run: npm run build
      # The documentation site: `check-docs.mjs` checks that every exported symbol has an entry with
      # all five sections, that every duration has a unit, that no link or anchor is dead and that a
      # page links SPEC.md. The build then fails on a dead internal link. The examples on the API
      # pages run in `cross-language.yml` (TypeScript, against the Python acceptor) and in the python
      # job above (`docs/examples` is in `testpaths`).
      - run: npm run docs:check
      - run: npm run docs:build
      - uses: actions/upload-artifact@v4
        with:
          name: node-coverage
          path: coverage/coverage-final.json
        if: github.event_name == 'pull_request'

  coverage:
    name: Incremental coverage check
    runs-on: ubuntu-latest
    needs: [python, node]
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-coverage'
          merge-multiple: true

      - name: Incremental coverage check
        uses: velis74/incremental-coverage-check@v3
        with:
          coverage-files: |
            coverage.json
            coverage-final.json
          # demo/, docs/ and interop/ are runnable examples and cross-language harnesses, not library
          # code. Neither pytest (scoped to muxws/) nor vitest (scoped to ts/) measures them, so they
          # have no coverage data and are excluded.
          extra-ignore-patterns: |
            demo/**
            demo.py
            docs/**
            interop/**
          log-level: INFO
          base-ref: ${{ github.base_ref }}
          head-ref: HEAD
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ github.event.pull_request.number }}

  # Interop runs in `cross-language.yml`, in both role assignments over both codecs, on the same
  # triggers as this workflow.
