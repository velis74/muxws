name: CI

on:
  push:
  pull_request:

env:
  # muxws counts every size limit in UTF-8 bytes (WSM-FRG-002) and its corpus carries non-BMP
  # characters, so the runner's locale is load-bearing rather than incidental.
  LANG: C.UTF-8

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .[dev] ruff
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=muxws

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # `npm install`, not `npm ci`: package-lock.json is deliberately not committed, so that CI
      # resolves dependencies afresh and tests against current upstream rather than a frozen tree.
      # See GAPS.md.
      - run: npm install
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run docs:build

  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -e .[dev]
      - run: npm install
      # Both role assignments over one scenario (WSM-TST-004's first half). A codec, a call shape or
      # a fragment boundary that disagrees between the ports fails here rather than in production.
      - run: MUXWS_VENV=$(dirname $(which python)) interop/drive.sh python ts
      - run: MUXWS_VENV=$(dirname $(which python)) interop/drive.sh ts python
