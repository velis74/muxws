name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .[dev] ruff
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=muxws

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # `npm install`, not `npm ci`: package-lock.json is deliberately gitignored, so a fresh
      # checkout has no lockfile for `npm ci` to read. See GAPS.md, G-3.
      - run: npm install
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run docs:build
