name: CI

on:
  push:
  pull_request:

env:
  # muxws counts every size limit in UTF-8 bytes (WSM-FRG-002) and its corpus carries non-BMP
  # characters, so the runner's locale is load-bearing rather than incidental.
  LANG: C.UTF-8

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .[dev] ruff
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=muxws

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # `npm install`, not `npm ci`: package-lock.json is deliberately not committed, so that CI
      # resolves dependencies afresh and tests against current upstream rather than a frozen tree.
      # See GAPS.md.
      - run: npm install
      # `lint:ci`, not `lint`: the developer script carries `--fix`, which rewrites the violation and
      # exits 0. In CI that rewrite is discarded with the runner, so an auto-fixable violation would
      # be reported by nothing and reach main unnoticed.
      - run: npm run lint:ci
      - run: npm test
      - run: npm run build
      - run: npm run docs:build

  # The interop job that used to live here is gone: it ran `drive.sh python ts main json` and its
  # mirror, which is a strict subset of `cross-language.yml`'s `scenario` matrix - same triggers,
  # same two role assignments, and that file also covers msgpack. Two copies of one job is two
  # things to keep in step, and the one that ships fewer codecs is the one that rots.
