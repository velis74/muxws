[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "muxws"
dynamic = ["version"]
description = "Multiplexed, cancellable, bidirectional streams over one WebSocket - protocol and reference implementation."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Jure Erznožnik", email = "jure.erznoznik@velis.si" },
]
requires-python = ">=3.10"
keywords = ["websocket", "multiplexing", "streams", "asyncio"]
classifiers = [
    # The wire version and the package version are independent. The subprotocol is `muxws.v1.<codec>`;
    # `v1` changes only with a breaking wire change. The package is 0.1.0 and alpha: it has no confirmed
    # production deployment. 1.0 requires the first confirmed production use.
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
starlette = ["starlette>=0.37"]
# Minimum 14. `muxws/api.py` dials with `websockets.connect(..., additional_headers=...)`. In websockets
# 12 and 13 the top-level `connect` is `websockets.legacy.client.connect`, which names that argument
# `extra_headers` and passes unknown arguments to the event loop, so the first dial raises `TypeError:
# BaseEventLoop.create_connection() got an unexpected keyword argument 'additional_headers'`. From 14.0
# `connect` is `websockets.asyncio.client.connect`. The `ws+unix:` path imports `unix_connect` from
# `websockets.asyncio.client`, which requires 13; the TCP path sets the minimum.
websockets = ["websockets>=14"]
msgpack = ["msgpack>=1.0"]
# The demo (`demo.py`, `demo/backend_python/`) uses the package and is not part of it: it is excluded
# from both artefacts and the library does not import it. `pip install -e ".[demo,starlette]"` installs
# everything `python demo.py --browser` needs; WSM-PKG-002 requires `[project] dependencies` to be empty.
# `websockets` is required although muxws does not import it here: uvicorn has no WebSocket protocol
# implementation of its own, and without one it answers 404 to every upgrade request while serving
# plain HTTP, so the page loads and the socket connection fails.
# All three are used by the Python backend only. `python demo.py --browser node` serves the same
# frontend from `demo/backend_node/` under Node and imports none of them; `missing_dependencies()` in
# `demo.py` therefore checks the selected backend first. `--uds` needs only `[websockets]`; `--bench`
# starts neither uvicorn nor a browser.
demo = ["fastapi", "uvicorn", "websockets"]
dev = [
    "coverage",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    # `muxws/packaging_test.py` builds a wheel and reads its member list; the manifest alone does not
    # show what hatch puts in the artefact. Without `build` the test is skipped.
    "build",
    "starlette",
    "websockets",
    "msgpack",
    # `transports/starlette_test.py` drives an ASGI app with Starlette's TestClient, which requires
    # httpx2. With plain `httpx` it works and emits a deprecation warning at import time, where a
    # module-level `pytest.mark.filterwarnings` does not apply.
    "httpx2",
    # The quick start in `docs/guide/getting-started.md` is a FastAPI app served by uvicorn, and
    # `docs/examples/run_examples_test.py` starts it. Without these two the three end-to-end example
    # tests are skipped.
    "fastapi",
    "uvicorn",
]

[project.urls]
Homepage = "https://github.com/velis74/muxws"
Repository = "https://github.com/velis74/muxws"
Issues = "https://github.com/velis74/muxws/issues"
Documentation = "https://docs.velis.si/muxws/"

[tool.hatch.version]
path = "muxws/__init__.py"

# The release tool updates the Python and npm manifests without configuration. `ts/version.ts`
# holds the version as an exported constant for the npm package and is listed here so the release tool
# updates it too. Without it, `package.json` gets the new version, `ts/version.ts` keeps the old one,
# and WSM-PKG-001 fails after the version is tagged.
[tool.publish]
additional_files = ["ts/version.ts"]

[tool.hatch.build.targets.wheel]
packages = ["muxws"]
# The wheel needs its own exclude list: the sdist exclude list below applies to the sdist only, and
# `python -m build` builds the wheel from the sdist. Tests and `conftest.py` are not part of the
# library; a packaged `conftest.py` can be picked up by pytest in a consumer's environment.
exclude = ["**/*_test.py", "**/conftest.py", "**/__pycache__"]

[tool.hatch.build.targets.sdist]
include = [
    "/muxws",
    "/conformance",
    "/README.md",
    "/LICENSE",
]
exclude = [
    "**/*_test.py",
]

[tool.pytest.ini_options]
# pytest collects only these paths. `docs/examples` contains `run_examples_test.py`, which checks that
# the examples print what the guide says they print. `demo` contains `demo/entry_point_test.py` and
# `demo/backend_python/handlers_test.py`; they need nothing beyond the `dev` extra. `[tool.coverage.run]`
# omits `demo/*`, so demo code does not count towards library coverage.
testpaths = ["muxws", "docs/examples", "demo"]
python_files = ["*_test.py"]
asyncio_mode = "auto"

[tool.ruff]
# `docs` is not excluded: `docs/examples/*.py` is source that readers copy, and it is linted like the
# library, including S101 (no bare `assert` outside a test).
#
# `*.md` is excluded because ruff formats fenced Python inside Markdown. `docs/` contains illustrative
# fragments in the guide, and design briefs and the specification under `docs/design/`, which a
# formatter must not rewrite. Executed Python lives in `docs/examples/*.py`, which this exclusion does
# not affect.
exclude = ['ts', '*.md', 'dist', 'build', 'node_modules', '.git', '.idea', '.vscode',
    '.pytest_cache', '.ruff_cache']
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "Q",    # flake8-quotes
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "PT",   # flake8-pytest-style
    "S",    # flake8-bandit
    "C4",   # flake8-comprehensions
    "ARG",  # flake8-unused-arguments
]
ignore = ["E731", "E722", "C408"]

fixable = ["ALL"]
unfixable = []

dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"*_test.py" = ["S101"]
# N818 requires exception names to end in "Error". WSM-ERR-004 fixes these names in both languages so
# that cross-language tests can assert on error identity.
"muxws/errors.py" = ["N818"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
case-sensitive = false
lines-between-types = 1
combine-as-imports = true
order-by-type = false

[tool.coverage.run]
# `docs/examples/run_examples_test.py` executes the documentation examples. They are not library
# code and are not shipped, so they are excluded from library coverage.
omit = ["*_test.py", "demo/*", "demo.py", "docs/examples/*"]
