[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "muxws"
dynamic = ["version"]
description = "Multiplexed, cancellable, bidirectional streams over one WebSocket - protocol and reference implementation."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Jure Erznožnik", email = "jure.erznoznik@gmail.com" },
]
requires-python = ">=3.10"
keywords = ["websocket", "multiplexing", "streams", "asyncio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
starlette = ["starlette>=0.37"]
websockets = ["websockets>=12"]
msgpack = ["msgpack>=1.0"]
# The demo (`demo.py`, `demo/backend/`) is a consumer of the shipped package, not part of it: it is
# excluded from both artefacts and nothing in the library imports it. These two are here so that
# `pip install -e ".[demo,starlette]"` is the whole story for running it, and so that they stay out
# of `[project] dependencies`, which WSM-PKG-002 requires to be empty.
demo = ["fastapi", "uvicorn"]
dev = [
    "coverage",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    # `muxws/packaging_test.py` builds a real wheel and reads its member list, because a test that
    # checks the manifest cannot see what hatch actually put in the artefact. Without this the test
    # skips, and a skip is indistinguishable from a pass.
    "build",
    "starlette",
    "websockets",
    "msgpack",
    "httpx",
    # The quick start in `docs/guide/getting-started.md` is a FastAPI app served by uvicorn, and
    # `docs/examples/run_examples_test.py` starts it for real. Without these two the three
    # end-to-end example tests skip, which is indistinguishable from passing.
    "fastapi",
    "uvicorn",
]

[project.urls]
Homepage = "https://github.com/velis74/muxws"
Repository = "https://github.com/velis74/muxws"
Issues = "https://github.com/velis74/muxws/issues"
Documentation = "https://docs.velis.si/muxws/"

[tool.hatch.version]
path = "muxws/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["muxws"]

[tool.hatch.build.targets.sdist]
include = [
    "/muxws",
    "/conformance",
    "/README.md",
    "/LICENSE",
]
exclude = [
    "**/*_test.py",
]

[tool.pytest.ini_options]
testpaths = ["muxws"]
python_files = ["*_test.py"]
asyncio_mode = "auto"

[tool.ruff]
# `docs` is deliberately absent: `docs/examples/*.py` is shipped source that a reader copies, so it
# is linted exactly like the library - which is what makes S101 (no bare `assert` outside a test)
# apply to the examples.
#
# `*.md` is excluded because this ruff formats fenced Python inside Markdown, and `docs/` is full of
# it: the guide's illustrative fragments, and the design briefs and the specification under
# `docs/design/`, which are a historical record and must not be rewritten by a formatter. The
# Python that is *executed* lives in `docs/examples/*.py`, which this exclusion does not touch.
exclude = ['ts', '*.md', 'dist', 'build', 'node_modules', '.git', '.idea', '.vscode',
    '.pytest_cache', '.ruff_cache']
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "Q",    # flake8-quotes
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "PT",   # flake8-pytest-style
    "S",    # flake8-bandit
    "C4",   # flake8-comprehensions
    "ARG",  # flake8-unused-arguments
]
ignore = ["E731", "E722", "C408"]

fixable = ["ALL"]
unfixable = []

dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"*_test.py" = ["S101"]
# N818 wants every exception name to end in "Error". WSM-ERR-004 fixes these names exactly, in
# both languages, so that cross-language tests can assert on error identity - the rule is simply
# inapplicable to this module. See GAPS.md.
"muxws/errors.py" = ["N818"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
case-sensitive = false
lines-between-types = 1
combine-as-imports = true
order-by-type = false

[tool.coverage.run]
# The documentation examples are executed by `docs/examples/run_examples_test.py`, but they are
# teaching material rather than library code: counting them would inflate the library's coverage
# with lines nobody ships.
omit = ["*_test.py", "demo/*", "demo.py", "docs/examples/*"]
