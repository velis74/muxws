[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "muxws"
dynamic = ["version"]
description = "Multiplexed, cancellable, bidirectional streams over one WebSocket - protocol and reference implementation."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Jure Erznožnik", email = "jure.erznoznik@gmail.com" },
]
requires-python = ">=3.10"
keywords = ["websocket", "multiplexing", "streams", "asyncio"]
classifiers = [
    # Two versions that move independently. The wire is at its first generation and frozen there:
    # `muxws.v1.<codec>` is the subprotocol and `v1` stays until a breaking change earns a new one.
    # The *package* is 0.1.0 and alpha, because nothing here has been through a real deployment yet;
    # 1.0 is what the first confirmed production use earns, not what a complete test suite earns.
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
starlette = ["starlette>=0.37"]
# 14, not 12, and the two releases in between are not a rounding error. `muxws/api.py` dials with
# `websockets.connect(..., additional_headers=...)`, and the top-level `connect` was an alias for
# `websockets.legacy.client.connect` until 14.0 moved it to `websockets.asyncio.client`. The legacy
# one spells that argument `extra_headers` and forwards anything it does not recognise straight to
# the event loop, so under 12 or 13 the *first* dial dies with `TypeError:
# BaseEventLoop.create_connection() got an unexpected keyword argument 'additional_headers'` - an
# error that names neither muxws nor the release that is too old. The `ws+unix:` arm imports
# `unix_connect` from `websockets.asyncio.client`, which needs 13, so the TCP path sets the floor.
websockets = ["websockets>=14"]
msgpack = ["msgpack>=1.0"]
# The demo (`demo.py`, `demo/backend_python/`) is a consumer of the shipped package, not part of it: it is
# excluded from both artefacts and nothing in the library imports it. These two are here so that
# `pip install -e ".[demo,starlette]"` is the whole story for running it, and so that they stay out
# of `[project] dependencies`, which WSM-PKG-002 requires to be empty.
# `websockets` is not optional here even though muxws itself does not import it: uvicorn ships no
# WebSocket protocol implementation of its own, and without one it answers **404 to every upgrade**
# while serving ordinary HTTP perfectly - so the demo loads in the browser and only the socket fails,
# which reads as a muxws defect and is not one. Reported by the first person to run the demo, whose
# environment had this extra and nothing else.
# All three belong to the *Python* backend. `python demo.py node` serves the same frontend from
# `demo/backend_node/` under Node and imports none of them, which is why `missing_dependencies()` in
# `demo.py` asks which backend before it asks what is missing.
demo = ["fastapi", "uvicorn", "websockets"]
dev = [
    "coverage",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    # `muxws/packaging_test.py` builds a real wheel and reads its member list, because a test that
    # checks the manifest cannot see what hatch actually put in the artefact. Without this the test
    # skips, and a skip is indistinguishable from a pass.
    "build",
    "starlette",
    "websockets",
    "msgpack",
    # Starlette's TestClient is what `transports/starlette_test.py` drives a real ASGI app with, and
    # it wants httpx2: with plain `httpx` it still works and warns, and the warning is emitted at
    # *import* time, where a `pytest.mark.filterwarnings` inside the module cannot reach it. Filtering
    # it would have been silencing a deprecation that can simply be resolved instead.
    "httpx2",
    # The quick start in `docs/guide/getting-started.md` is a FastAPI app served by uvicorn, and
    # `docs/examples/run_examples_test.py` starts it for real. Without these two the three
    # end-to-end example tests skip, which is indistinguishable from passing.
    "fastapi",
    "uvicorn",
]

[project.urls]
Homepage = "https://github.com/velis74/muxws"
Repository = "https://github.com/velis74/muxws"
Issues = "https://github.com/velis74/muxws/issues"
Documentation = "https://docs.velis.si/muxws/"

[tool.hatch.version]
path = "muxws/__init__.py"

# The release tool stamps the two manifests by itself. `ts/version.ts` is the third place the version
# is written down - the npm half exports it as a constant - and nothing about a Python manifest points
# at it, so it is named here. Leaving it out is what makes WSM-PKG-001 fail *after* a release rather
# than before one: the bump lands in `package.json`, the constant keeps the previous number, and the
# test that exists to notice exactly that only runs once the version has already been tagged.
[tool.publish]
additional_files = ["ts/version.ts"]

[tool.hatch.build.targets.wheel]
packages = ["muxws"]
# The wheel is the artefact a consumer actually installs, and until this existed it carried the whole
# test suite, `conftest.py`, and `__pycache__` full of bytecode from a developer's machine. `python -m
# build` hid it by building the wheel *from* the sdist, whose own exclude list is below - so the
# defect was invisible to every check that did not install the wheel and look inside the package.
# Tests are not part of the library: shipping them means a consumer downloads them, and a
# package-level `conftest.py` is a file pytest can be made to notice.
exclude = ["**/*_test.py", "**/conftest.py", "**/__pycache__"]

[tool.hatch.build.targets.sdist]
include = [
    "/muxws",
    "/conformance",
    "/README.md",
    "/LICENSE",
]
exclude = [
    "**/*_test.py",
]

[tool.pytest.ini_options]
# `docs/examples` is here because leaving it out meant `run_examples_test.py` never ran: it holds the
# end-to-end checks that the shipped examples still print what the guide says they print, and a test
# nothing collects is weaker than a test that skips - a skip at least says so.
#
# `demo` for the same reason: `demo/entry_point_test.py` and `demo/backend_python/handlers_test.py`
# sit under neither of the two entries above, and this list is the whole of what pytest collects.
# They pass in about a second and load nothing the `dev` extra does not already provide. Coverage is
# unaffected - `[tool.coverage.run]` omits `demo/*`
# deliberately, since the demo is a consumer of the library and counting it would inflate the
# library's own figure.
testpaths = ["muxws", "docs/examples", "demo"]
python_files = ["*_test.py"]
asyncio_mode = "auto"

[tool.ruff]
# `docs` is deliberately absent: `docs/examples/*.py` is shipped source that a reader copies, so it
# is linted exactly like the library - which is what makes S101 (no bare `assert` outside a test)
# apply to the examples.
#
# `*.md` is excluded because this ruff formats fenced Python inside Markdown, and `docs/` is full of
# it: the guide's illustrative fragments, and the design briefs and the specification under
# `docs/design/`, which are a historical record and must not be rewritten by a formatter. The
# Python that is *executed* lives in `docs/examples/*.py`, which this exclusion does not touch.
exclude = ['ts', '*.md', 'dist', 'build', 'node_modules', '.git', '.idea', '.vscode',
    '.pytest_cache', '.ruff_cache']
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "Q",    # flake8-quotes
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "PT",   # flake8-pytest-style
    "S",    # flake8-bandit
    "C4",   # flake8-comprehensions
    "ARG",  # flake8-unused-arguments
]
ignore = ["E731", "E722", "C408"]

fixable = ["ALL"]
unfixable = []

dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"*_test.py" = ["S101"]
# N818 wants every exception name to end in "Error". WSM-ERR-004 fixes these names exactly, in
# both languages, so that cross-language tests can assert on error identity - the rule is simply
# inapplicable to this module. See GAPS.md.
"muxws/errors.py" = ["N818"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
case-sensitive = false
lines-between-types = 1
combine-as-imports = true
order-by-type = false

[tool.coverage.run]
# The documentation examples are executed by `docs/examples/run_examples_test.py`, but they are
# teaching material rather than library code: counting them would inflate the library's coverage
# with lines nobody ships.
omit = ["*_test.py", "demo/*", "demo.py", "docs/examples/*"]
