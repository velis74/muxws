[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "muxws"
dynamic = ["version"]
description = "Multiplexed, cancellable, bidirectional streams over one WebSocket - protocol and reference implementation."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Jure Erznožnik", email = "jure.erznoznik@gmail.com" },
]
requires-python = ">=3.10"
keywords = ["websocket", "multiplexing", "streams", "asyncio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
starlette = ["starlette>=0.37"]
websockets = ["websockets>=12"]
msgpack = ["msgpack>=1.0"]
dev = [
    "coverage",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "starlette",
    "websockets",
    "msgpack",
    "httpx",
]

[project.urls]
Homepage = "https://github.com/dynamicforms/muxws"
Repository = "https://github.com/dynamicforms/muxws"
Issues = "https://github.com/dynamicforms/muxws/issues"
Documentation = "https://docs.velis.si/muxws/"

[tool.hatch.version]
path = "muxws/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["muxws"]

[tool.hatch.build.targets.sdist]
include = [
    "/muxws",
    "/conformance",
    "/README.md",
    "/LICENSE",
]
exclude = [
    "**/*_test.py",
]

[tool.pytest.ini_options]
testpaths = ["muxws"]
python_files = ["*_test.py"]
asyncio_mode = "auto"

[tool.ruff]
exclude = ['ts', 'docs', 'dist', 'build', 'node_modules', '.git', '.idea', '.vscode',
    '.pytest_cache', '.ruff_cache']
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "Q",    # flake8-quotes
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "PT",   # flake8-pytest-style
    "S",    # flake8-bandit
    "C4",   # flake8-comprehensions
    "ARG",  # flake8-unused-arguments
]
ignore = ["E731", "E722", "C408"]

fixable = ["ALL"]
unfixable = []

dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"*_test.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
case-sensitive = false
lines-between-types = 1
combine-as-imports = true
order-by-type = false

[tool.coverage.run]
omit = ["*_test.py", "demo/*", "demo.py"]
